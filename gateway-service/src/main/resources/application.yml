server:
  port: 8080


spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/posts/**
      discovery:
        locator:
          enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-skt01p8dhor0esjl.us.auth0.com/
          audiences: https://ddsi.com/api/ddsi-poc-microservicios

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true