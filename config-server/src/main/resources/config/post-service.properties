# suppress inspection "UnusedProperty" for whole file
server.port=${POST_SERVER_PORT:8081}

#Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

#Database
spring.datasource.url=${SPRING_MYSQL_URI:jdbc:mysql://localhost:3306/post_adondevamos_db?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#LOGGING
logging.level.root=INFO
logging.level.com.github.ezequielarroyo.domain=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/user-service.log
logging.file.max-size=10MB
logging.file.max-history=30